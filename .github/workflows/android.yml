name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | tail -n 1)"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore signing key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        id: ver
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk itv-android7.apk
          CODE=$(python3 -c "import re; t=open('android/app/build.gradle.kts',encoding='utf-8').read(); print(re.search(r'versionCode\\s*=\\s*(\\d+)',t).group(1))")
          NAME=$(python3 -c "import re; t=open('android/app/build.gradle.kts',encoding='utf-8').read(); print(re.search(r'versionName\\s*=\\s*\"([^\"]+)\"',t).group(1))")
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$CODE" "$NAME" > version.json
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # 签名漂了就当场失败。上一次是等真机上装不上才发现的，
      # 那时候 APK 已经发出去了
      - name: Assert signing fingerprint
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          # 取最后一个字段就是那串 hex。之前用 tr+cut 按冒号切，
          # 切出来是 "certificateSHA-256digest"，白失败一次
          GOT=$("$APKSIGNER" verify --print-certs itv-android7.apk | awk '/SHA-256 digest/ {print $NF; exit}')
          WANT="8d5d26c5d00dbb36244ee0accb708ce97024857872a653ed0cd7043159aa32e9"
          echo "fingerprint=$GOT"
          if [ "$GOT" != "$WANT" ]; then
            echo "签名指纹对不上，期望 $WANT" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: itv-android7
          path: |
            itv-android7.apk
            version.json
          if-no-files-found: error

      - name: Publish download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: iTV Android 7 ${{ steps.ver.outputs.name }}
          body: |
            versionCode: ${{ steps.ver.outputs.code }}
            versionName: ${{ steps.ver.outputs.name }}
            安卓 7+ 收看 App，覆盖安装即可。
            默认服务器 `https://itv.ityc.cc`。
          files: |
            itv-android7.apk
            version.json
          make_latest: true
